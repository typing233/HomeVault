<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeVault - 家庭物品管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #2c3e50; color: #ecf0f1; padding: 20px 0; position: fixed; height: 100vh; }
        .sidebar h1 { font-size: 18px; padding: 0 20px 20px; border-bottom: 1px solid #34495e; }
        .sidebar nav a { display: block; padding: 12px 20px; color: #bdc3c7; text-decoration: none; transition: all .2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #34495e; color: #fff; }
        .main { margin-left: 220px; flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h2 { font-size: 24px; color: #2c3e50; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all .2s; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card h3 { margin-bottom: 8px; color: #2c3e50; }
        .card p { color: #7f8c8d; font-size: 14px; margin-bottom: 4px; }
        .card .actions { margin-top: 12px; display: flex; gap: 8px; }
        .badge { display: inline-block; padding: 2px 8px; background: #ecf0f1; border-radius: 12px; font-size: 12px; color: #555; margin: 2px; }
        .badge-blue { background: #d4e6f1; color: #2471a3; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #2c3e50; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-group textarea { height: 80px; resize: vertical; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; }
        .checkbox-group label:has(input:checked) { border-color: #3498db; background: #ebf5fb; }
        .checkbox-group input[type="checkbox"] { width: auto; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: #fff; border-radius: 8px; padding: 24px; width: 500px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 20px; }
        .modal .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .empty { text-align: center; padding: 40px; color: #95a5a6; }
        .detail-back { color: #3498db; cursor: pointer; margin-bottom: 16px; display: inline-block; }
        .detail-info { display: grid; grid-template-columns: 120px 1fr; gap: 8px; font-size: 14px; }
        .detail-info dt { color: #7f8c8d; font-weight: 500; }
        .detail-info dd { color: #333; }
        .stats { display: flex; gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 8px; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: bold; color: #3498db; }
        .stat-card .label { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1>🏠 HomeVault</h1>
        <nav>
            <a href="#" data-page="dashboard" class="active">概览</a>
            <a href="#" data-page="rooms">房间管理</a>
            <a href="#" data-page="categories">分类管理</a>
            <a href="#" data-page="items">物品管理</a>
        </nav>
    </aside>
    <main class="main" id="app-main"></main>
</div>

<script>
const API = '';
let currentPage = 'dashboard';
let rooms = [], categories = [], items = [];

// Navigation
document.querySelectorAll('.sidebar nav a').forEach(a => {
    a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.sidebar nav a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        currentPage = a.dataset.page;
        render();
    });
});

async function fetchAll() {
    [rooms, categories, items] = await Promise.all([
        fetch(API + '/api/rooms').then(r => r.json()),
        fetch(API + '/api/categories').then(r => r.json()),
        fetch(API + '/api/items').then(r => r.json())
    ]);
}

async function render() {
    await fetchAll();
    const main = document.getElementById('app-main');
    switch(currentPage) {
        case 'dashboard': main.innerHTML = renderDashboard(); break;
        case 'rooms': main.innerHTML = renderRooms(); break;
        case 'categories': main.innerHTML = renderCategories(); break;
        case 'items': main.innerHTML = renderItems(); break;
        case 'room-detail': main.innerHTML = renderRoomDetail(); break;
        case 'category-detail': main.innerHTML = renderCategoryDetail(); break;
        case 'item-detail': main.innerHTML = renderItemDetail(); break;
    }
    bindEvents();
}

// ===== Dashboard =====
function renderDashboard() {
    return `
        <div class="header"><h2>概览</h2></div>
        <div class="stats">
            <div class="stat-card"><div class="num">${rooms.length}</div><div class="label">房间</div></div>
            <div class="stat-card"><div class="num">${categories.length}</div><div class="label">分类</div></div>
            <div class="stat-card"><div class="num">${items.length}</div><div class="label">物品</div></div>
            <div class="stat-card"><div class="num">¥${items.reduce((s,i) => s + (i.price||0), 0).toFixed(0)}</div><div class="label">总价值</div></div>
        </div>
        <h3 style="margin-bottom:12px">最近添加的物品</h3>
        <div class="card-grid">
            ${items.slice(0, 6).map(item => `
                <div class="card">
                    <h3>${esc(item.name)}</h3>
                    <p>${item.room_name ? '📍 ' + esc(item.room_name) : '未分配房间'}</p>
                    <p>${item.categories.map(c => `<span class="badge badge-blue">${esc(c.name)}</span>`).join('')}</p>
                    ${item.price ? `<p>💰 ¥${item.price}</p>` : ''}
                </div>
            `).join('')}
        </div>
        ${items.length === 0 ? '<div class="empty">还没有任何物品，去添加一些吧！</div>' : ''}
    `;
}

// ===== Rooms =====
function renderRooms() {
    return `
        <div class="header"><h2>房间管理</h2><button class="btn btn-primary" data-action="add-room">+ 添加房间</button></div>
        <div class="card-grid">
            ${rooms.map(r => `
                <div class="card">
                    <h3>${esc(r.name)}</h3>
                    <p>${esc(r.description) || '暂无描述'}</p>
                    <p><span class="badge">${r.item_count} 件物品</span></p>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" data-action="view-room" data-id="${r.id}">查看</button>
                        <button class="btn btn-secondary btn-sm" data-action="edit-room" data-id="${r.id}">编辑</button>
                        <button class="btn btn-danger btn-sm" data-action="delete-room" data-id="${r.id}">删除</button>
                    </div>
                </div>
            `).join('')}
        </div>
        ${rooms.length === 0 ? '<div class="empty">还没有房间，点击上方按钮添加</div>' : ''}
    `;
}

// ===== Categories =====
function renderCategories() {
    return `
        <div class="header"><h2>分类管理</h2><button class="btn btn-primary" data-action="add-category">+ 添加分类</button></div>
        <div class="card-grid">
            ${categories.map(c => `
                <div class="card">
                    <h3>${esc(c.name)}</h3>
                    <p>${esc(c.description) || '暂无描述'}</p>
                    <p><span class="badge">${c.item_count} 件物品</span></p>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" data-action="view-category" data-id="${c.id}">查看</button>
                        <button class="btn btn-secondary btn-sm" data-action="edit-category" data-id="${c.id}">编辑</button>
                        <button class="btn btn-danger btn-sm" data-action="delete-category" data-id="${c.id}">删除</button>
                    </div>
                </div>
            `).join('')}
        </div>
        ${categories.length === 0 ? '<div class="empty">还没有分类，点击上方按钮添加</div>' : ''}
    `;
}

// ===== Items =====
function renderItems() {
    return `
        <div class="header"><h2>物品管理</h2><button class="btn btn-primary" data-action="add-item">+ 添加物品</button></div>
        <div class="card-grid">
            ${items.map(item => `
                <div class="card">
                    <h3>${esc(item.name)}</h3>
                    <p>${item.room_name ? '📍 ' + esc(item.room_name) : '<span style="color:#ccc">未分配房间</span>'}</p>
                    <p>${item.categories.map(c => `<span class="badge badge-blue">${esc(c.name)}</span>`).join('') || '<span class="badge">未分类</span>'}</p>
                    ${item.price ? `<p>💰 ¥${item.price}</p>` : ''}
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" data-action="view-item" data-id="${item.id}">查看</button>
                        <button class="btn btn-secondary btn-sm" data-action="edit-item" data-id="${item.id}">编辑</button>
                        <button class="btn btn-danger btn-sm" data-action="delete-item" data-id="${item.id}">删除</button>
                    </div>
                </div>
            `).join('')}
        </div>
        ${items.length === 0 ? '<div class="empty">还没有物品，点击上方按钮添加</div>' : ''}
    `;
}

// ===== Detail Pages =====
let detailId = null;

function renderRoomDetail() {
    const room = rooms.find(r => r.id === detailId);
    if (!room) return '<div class="empty">房间不存在</div>';
    const roomItems = items.filter(i => i.room_id === room.id);
    return `
        <span class="detail-back" data-action="back-rooms">← 返回房间列表</span>
        <div class="card">
            <h3>${esc(room.name)}</h3>
            <p style="margin-top:8px">${esc(room.description) || '暂无描述'}</p>
        </div>
        <h3 style="margin:16px 0 12px">房间内的物品 (${roomItems.length})</h3>
        <div class="card-grid">
            ${roomItems.map(item => `
                <div class="card">
                    <h3>${esc(item.name)}</h3>
                    ${item.price ? `<p>💰 ¥${item.price}</p>` : ''}
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" data-action="view-item" data-id="${item.id}">查看</button>
                    </div>
                </div>
            `).join('')}
        </div>
        ${roomItems.length === 0 ? '<div class="empty">该房间暂无物品</div>' : ''}
    `;
}

function renderCategoryDetail() {
    const cat = categories.find(c => c.id === detailId);
    if (!cat) return '<div class="empty">分类不存在</div>';
    const catItems = items.filter(i => i.categories.some(c => c.id === cat.id));
    return `
        <span class="detail-back" data-action="back-categories">← 返回分类列表</span>
        <div class="card">
            <h3>${esc(cat.name)}</h3>
            <p style="margin-top:8px">${esc(cat.description) || '暂无描述'}</p>
        </div>
        <h3 style="margin:16px 0 12px">该分类下的物品 (${catItems.length})</h3>
        <div class="card-grid">
            ${catItems.map(item => `
                <div class="card">
                    <h3>${esc(item.name)}</h3>
                    <p>${item.room_name ? '📍 ' + esc(item.room_name) : ''}</p>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" data-action="view-item" data-id="${item.id}">查看</button>
                    </div>
                </div>
            `).join('')}
        </div>
        ${catItems.length === 0 ? '<div class="empty">该分类暂无物品</div>' : ''}
    `;
}

function renderItemDetail() {
    const item = items.find(i => i.id === detailId);
    if (!item) return '<div class="empty">物品不存在</div>';
    return `
        <span class="detail-back" data-action="back-items">← 返回物品列表</span>
        <div class="card">
            <h3>${esc(item.name)}</h3>
            <dl class="detail-info" style="margin-top:16px">
                <dt>描述</dt><dd>${esc(item.description) || '无'}</dd>
                <dt>所在房间</dt><dd>${item.room_name ? esc(item.room_name) : '未分配'}</dd>
                <dt>分类</dt><dd>${item.categories.map(c => `<span class="badge badge-blue">${esc(c.name)}</span>`).join('') || '未分类'}</dd>
                <dt>购买日期</dt><dd>${item.purchase_date || '未记录'}</dd>
                <dt>价格</dt><dd>${item.price ? '¥' + item.price : '未记录'}</dd>
                <dt>添加时间</dt><dd>${item.created_at || ''}</dd>
            </dl>
            <div class="actions" style="margin-top:16px">
                <button class="btn btn-secondary" data-action="edit-item" data-id="${item.id}">编辑</button>
                <button class="btn btn-danger" data-action="delete-item" data-id="${item.id}">删除</button>
            </div>
        </div>
    `;
}

// ===== Modals =====
function showModal(title, body) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal"><h3>${title}</h3>${body}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    return overlay;
}

function roomForm(room = null) {
    const title = room ? '编辑房间' : '添加房间';
    const overlay = showModal(title, `
        <form id="room-form">
            <div class="form-group"><label>名称</label><input name="name" value="${esc(room?.name || '')}" required></div>
            <div class="form-group"><label>描述</label><textarea name="description">${esc(room?.description || '')}</textarea></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" data-action="close-modal">取消</button>
                <button type="submit" class="btn btn-primary">${room ? '保存' : '添加'}</button>
            </div>
        </form>
    `);
    overlay.querySelector('#room-form').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = { name: fd.get('name'), description: fd.get('description') };
        if (room) {
            await fetch(API + `/api/rooms/${room.id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        } else {
            await fetch(API + '/api/rooms', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        }
        overlay.remove();
        render();
    });
    overlay.querySelector('[data-action="close-modal"]').onclick = () => overlay.remove();
}

function categoryForm(cat = null) {
    const title = cat ? '编辑分类' : '添加分类';
    const overlay = showModal(title, `
        <form id="cat-form">
            <div class="form-group"><label>名称</label><input name="name" value="${esc(cat?.name || '')}" required></div>
            <div class="form-group"><label>描述</label><textarea name="description">${esc(cat?.description || '')}</textarea></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" data-action="close-modal">取消</button>
                <button type="submit" class="btn btn-primary">${cat ? '保存' : '添加'}</button>
            </div>
        </form>
    `);
    overlay.querySelector('#cat-form').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = { name: fd.get('name'), description: fd.get('description') };
        if (cat) {
            await fetch(API + `/api/categories/${cat.id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        } else {
            await fetch(API + '/api/categories', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        }
        overlay.remove();
        render();
    });
    overlay.querySelector('[data-action="close-modal"]').onclick = () => overlay.remove();
}

function itemForm(item = null) {
    const title = item ? '编辑物品' : '添加物品';
    const itemCatIds = item ? item.categories.map(c => c.id) : [];
    const overlay = showModal(title, `
        <form id="item-form">
            <div class="form-group"><label>名称</label><input name="name" value="${esc(item?.name || '')}" required></div>
            <div class="form-group"><label>描述</label><textarea name="description">${esc(item?.description || '')}</textarea></div>
            <div class="form-group"><label>所在房间</label>
                <select name="room_id">
                    <option value="">-- 选择房间 --</option>
                    ${rooms.map(r => `<option value="${r.id}" ${item && item.room_id === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
                </select>
            </div>
            <div class="form-group"><label>分类（可多选）</label>
                <div class="checkbox-group">
                    ${categories.map(c => `<label><input type="checkbox" name="category_ids" value="${c.id}" ${itemCatIds.includes(c.id) ? 'checked' : ''}>${esc(c.name)}</label>`).join('')}
                </div>
                ${categories.length === 0 ? '<p style="color:#999;font-size:12px">暂无分类，请先添加分类</p>' : ''}
            </div>
            <div class="form-group"><label>购买日期</label><input type="date" name="purchase_date" value="${item?.purchase_date || ''}"></div>
            <div class="form-group"><label>价格 (¥)</label><input type="number" step="0.01" min="0" name="price" value="${item?.price || ''}"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" data-action="close-modal">取消</button>
                <button type="submit" class="btn btn-primary">${item ? '保存' : '添加'}</button>
            </div>
        </form>
    `);
    overlay.querySelector('#item-form').addEventListener('submit', async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const catIds = Array.from(overlay.querySelectorAll('input[name="category_ids"]:checked')).map(cb => parseInt(cb.value));
        const data = {
            name: fd.get('name'),
            description: fd.get('description'),
            room_id: fd.get('room_id') ? parseInt(fd.get('room_id')) : null,
            category_ids: catIds,
            purchase_date: fd.get('purchase_date'),
            price: fd.get('price') ? parseFloat(fd.get('price')) : 0
        };
        if (item) {
            await fetch(API + `/api/items/${item.id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        } else {
            await fetch(API + '/api/items', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        }
        overlay.remove();
        render();
    });
    overlay.querySelector('[data-action="close-modal"]').onclick = () => overlay.remove();
}

// ===== Event Binding =====
function bindEvents() {
    document.querySelectorAll('[data-action]').forEach(el => {
        el.onclick = async function() {
            const action = this.dataset.action;
            const id = parseInt(this.dataset.id);
            switch(action) {
                case 'add-room': roomForm(); break;
                case 'edit-room': roomForm(rooms.find(r => r.id === id)); break;
                case 'delete-room':
                    if (confirm('确定删除此房间？房间内物品将变为未分配状态。')) {
                        await fetch(API + `/api/rooms/${id}`, { method: 'DELETE' });
                        render();
                    }
                    break;
                case 'view-room': detailId = id; currentPage = 'room-detail'; render(); break;
                case 'back-rooms': currentPage = 'rooms'; render(); break;

                case 'add-category': categoryForm(); break;
                case 'edit-category': categoryForm(categories.find(c => c.id === id)); break;
                case 'delete-category':
                    if (confirm('确定删除此分类？')) {
                        await fetch(API + `/api/categories/${id}`, { method: 'DELETE' });
                        render();
                    }
                    break;
                case 'view-category': detailId = id; currentPage = 'category-detail'; render(); break;
                case 'back-categories': currentPage = 'categories'; render(); break;

                case 'add-item': itemForm(); break;
                case 'edit-item': {
                    const resp = await fetch(API + `/api/items/${id}`);
                    const full = await resp.json();
                    itemForm(full);
                    break;
                }
                case 'delete-item':
                    if (confirm('确定删除此物品？')) {
                        await fetch(API + `/api/items/${id}`, { method: 'DELETE' });
                        if (currentPage === 'item-detail') { currentPage = 'items'; }
                        render();
                    }
                    break;
                case 'view-item': detailId = id; currentPage = 'item-detail'; render(); break;
                case 'back-items': currentPage = 'items'; render(); break;
            }
        };
    });
}

function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

render();
</script>
</body>
</html>
